[package]
name = "cort-evals"
version = "0.1.0"
edition = "2021"
description = "Agent evaluation harness for cort. Dev-only tooling: nothing here is shipped by install.sh."

# The repo is pure Rust. The harness used to be six .mjs files, which meant the thing that
# decides whether cort gets built further was the only untyped, un-linted, un-gated part of the
# tree. serde_json is already a product dependency, so this crate adds no new vendored crate.
[dependencies]
serde_json = "1"
# The product crate supplies what the evals read rather than restate: the graph's gate primitives,
# the index's `Db`, and the usage machine stamp.
# This direction only: AGENTS.md forbids the product depending on the harness.
cort = { path = "../rust" }
# Same version and features as the product crate, so the two crates share one build of it.
# gate-audit reads `raw_edges` read-only through the public `Db` (a `Connection` alias) and
# leaves every gate decision in `cort::graph`; it never writes.
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
