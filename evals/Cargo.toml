[package]
name = "cort-evals"
version = "0.1.0"
edition = "2021"
description = "Agent evaluation harness for cort. Dev-only tooling: nothing here is shipped by install.sh."

# The repo is pure Rust. The harness used to be six .mjs files, which meant the thing that
# decides whether cort gets built further was the only untyped, un-linted, un-gated part of the
# tree. serde_json is already a product dependency, so this crate adds no new vendored crate.
[dependencies]
serde_json = "1"
# The matcher lives in the product crate so the measured rule and the installed rule are one rule.
# This direction only: AGENTS.md forbids the product depending on the harness.
cort = { path = "../rust" }

[dev-dependencies]
tempfile = "3"
