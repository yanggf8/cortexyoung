name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint-and-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install deps
        run: npm ci

      - name: install pinned ast-grep
        run: bash install.sh --check || bash install.sh

      - name: unit tests
        run: npm test

      - name: bash -n (syntax check)
        run: |
          bash -n install.sh
          bash -n tests/install-smoke.sh

      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .
          severity: warning
          # node_modules holds vendored dependency scripts we neither own nor can fix
          # (e.g. better-sqlite3/deps/download.sh). Lint only our own shell.
          ignore_paths: node_modules
        env:
          SHELLCHECK_OPTS: -e SC2143 -e SC1091

      - name: offline install smoke test
        run: bash tests/install-smoke.sh
