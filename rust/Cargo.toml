[package]
name = "cort"
version = "0.1.0"
edition = "2021"

[lib]
name = "cort"
path = "src/lib.rs"

[[bin]]
name = "cort"
path = "src/main.rs"

# Dev-only stand-in for the ast-grep CLI, so the pathological parser tests do not need a scripting
# runtime (the repo is pure Rust). Always built — `cargo test` must work with no special feature —
# but never installed: install.sh copies `cort` and the pack only.
[[bin]]
name = "fake_ast_grep"
path = "src/bin/fake_ast_grep.rs"

# Dev-only resource gate fixture; never copied into the installed payload.
[[bin]]
name = "fake_gate"
path = "src/bin/fake_gate.rs"

# Repo-local upgrader: diagnoses an existing install and brings it to what THIS tree
# requires. Never installed — it runs the new tree's code, so it belongs to the tree.
[[bin]]
name = "cort_upgrade"
path = "src/bin/cort_upgrade.rs"

[dependencies]
# bundled SQLite already compiles SQLITE_ENABLE_FTS5 (libsqlite3-sys build.rs).
# There is no rusqlite `fts5` cargo feature to add; do not add extra crates.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No `tls` feature: it enables rustls's `ring` beside `aws-lc-rs`. Keep exactly one
# crypto provider compiled in so `ClientConfig::builder()` cannot panic.
ureq = { version = "2", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
webpki-roots = "1"
# The webpki roots above are a floor, not the whole story: a corporate TLS-intercepting proxy
# (Prisma Access et al.) re-signs every outbound certificate with a CA the OS trusts but webpki
# does not carry -- 2026-11-02 on this repo's own corporate Mac a `harnessuse` read answered
# `unreachable` while curl over the system trust store returned 200. The system roots union in
# beside webpki (remote.rs `tls()`), fail-soft.
rustls-native-certs = "0.8.5"
sha2 = "0.11"
clap = { version = "4", features = ["derive"] }
# The scan hot path runs the rule pack in-process (src/scan.rs); the CLI stays only for
# `struct --pattern` and as CORT_SCAN_BACKEND=cli. Pinned to the same minor the installed CLI
# carries; `cargo update` moves these together with the pin check and the parity probe.
ast-grep-config = "0.45.3"
ast-grep-core = "0.45.3"
ast-grep-language = "0.45.3"
globset = "0.4"
ignore = "0.4"
# Codex's hook wiring lives in ~/.codex/config.toml (settings_toml.rs), not settings.json. toml_edit
# over the plain `toml` crate because it round-trips a partial edit without reformatting or dropping
# comments elsewhere in the file -- the same "everything else survives byte-identical" guarantee
# settings.rs already holds for the JSON side. It is what `cargo` itself uses to edit Cargo.toml.
toml_edit = "0.25"

[dev-dependencies]
tempfile = "3"
