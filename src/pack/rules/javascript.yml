id: cort-js-chunk-const-function
language: JavaScript
severity: hint
message: chunk:function
rule:
  kind: variable_declarator
  all:
    - has: { field: name, kind: identifier, pattern: $NAME }
    - any:
        - has: { field: value, kind: arrow_function }
        - has: { field: value, kind: function_expression }
        - has:
            field: value
            kind: call_expression
            all:
              - has: { field: function, kind: identifier }
              - has: { kind: arguments, has: { kind: arrow_function } }
