id: cort-rust-chunk-free-function
language: Rust
severity: hint
message: chunk:function
rule:
  kind: function_item
  all:
    - has: { field: name, pattern: $NAME }
    - not:
        inside:
          stopBy: end
          any:
            - { kind: impl_item }
            - { kind: trait_item }
---
id: cort-rust-chunk-impl-method
language: Rust
severity: hint
message: chunk:method
rule:
  kind: function_item
  all:
    - has: { field: name, pattern: $NAME }
    - inside:
        kind: impl_item
        stopBy: end
        has: { field: type, pattern: $OWNER }
---
id: cort-rust-chunk-trait-default-method
language: Rust
severity: hint
message: chunk:method
rule:
  kind: function_item
  all:
    - has: { field: name, pattern: $NAME }
    - inside:
        kind: trait_item
        stopBy: end
        has: { field: name, pattern: $OWNER }
# Three call shapes, three forms, named in the message because the message string is the only
# channel a rule has to the parser (`chunker::parse_edge_tag`). The form decides the resolution
# policy -- see `graph::resolve_edge_targets` -- so these three rules may not be collapsed.
#
# `field_expression` rather than `method_call_expression`: the Rust grammar ast-grep 0.45.2 pins has
# no such node. `t.add()` is a `call_expression` whose `function` is a `field_expression` with the
# method name in `field`. A rule written against the older node name matches nothing and says so by
# producing no edges at all, which is how the receiver shape stayed invisible for this long.
---
id: cort-rust-edge-calls
language: Rust
severity: hint
message: edge:calls:bare
rule:
  kind: call_expression
  has: { field: function, kind: identifier, pattern: $CALLEE }
---
id: cort-rust-edge-calls-scoped
language: Rust
severity: hint
message: edge:calls:scoped
rule:
  kind: call_expression
  has:
    field: function
    kind: scoped_identifier
    pattern: $CALLEE
---
# $CALLEE is the whole call head (`tally.add`), not the method name: the receiver is the only
# evidence available for whether this call can bind to a given symbol, and a receiver-shaped edge
# without it is an unverifiable name match. $METHOD is the name itself, so the edge can be pinned to
# the line the callee is written on -- which for `tally\n    .add()` is not where the head starts.
id: cort-rust-edge-calls-receiver
language: Rust
severity: hint
message: edge:calls:receiver
rule:
  kind: call_expression
  has:
    field: function
    kind: field_expression
    all:
      - pattern: $CALLEE
      - has: { field: field, kind: field_identifier, pattern: $METHOD }
---
id: cort-rust-edge-imports
language: Rust
severity: hint
message: edge:imports
rule: { kind: use_declaration, has: { field: argument, pattern: $SRC } }
---
# struct / enum / trait become `chunk:class`, the bucket JS/TS/Python type declarations already use.
# A dedicated `chunk_type` would mean widening the CHECK on `chunks` and rebuilding its
# external-content FTS mirror for a label the chunk's own content already shows.
#
# `type_item` (a plain alias) and `union_item` are deliberately NOT chunks: an alias has no body to
# slice, and a union's members are not a caller set anyone asks about. Both still have their own
# names excluded from the reference rule below -- not being a chunk is not the same as being a use.
id: cort-rust-chunk-type
language: Rust
severity: hint
message: chunk:class
rule:
  any:
    - { kind: struct_item, has: { field: name, pattern: $NAME } }
    - { kind: enum_item, has: { field: name, pattern: $NAME } }
    - { kind: trait_item, has: { field: name, pattern: $NAME } }
---
# Two reference rules, for the same reason there are two call rules: a qualified target must keep its
# path. `settings::SettingsError` and `settings_toml::SettingsError` are both live in this repo, and
# the module-suffix branch of `graph::resolve_targets` only runs when the stored target contains
# `::`. Capture the leaf alone and both definitions match, both are written AMBIGUOUS, and no screen
# this product has can see the phantom -- `impact` drops confidence, coverage counts any edge to the
# seed as resolved, and `verify-impact` only asks whether the line contains the word.
id: cort-rust-edge-references-scoped
language: Rust
severity: hint
message: edge:references:type
rule:
  kind: scoped_type_identifier
  pattern: $CALLEE
---
# The bare half. The `not` drops each declaration's OWN name -- `associated_type` and `union_item`
# are distinct nodes from `type_item` in this grammar and each needs naming, or a trait cites its own
# associated type and a union cites itself -- and drops any leaf already covered by the scoped rule,
# so one qualified path yields one edge rather than two.
#
# Generic parameters (`T`, `E`) are knowingly NOT excluded: ast-grep cannot do the scope analysis, a
# single-uppercase-letter regex is a naming convention pretending to be semantics, and `T` resolves
# to nothing unless the project declares a real type by that name. Primitives need no rule either --
# `u8` is a `primitive_type`, a different node, so it never enters the graph at all.
id: cort-rust-edge-references-bare
language: Rust
severity: hint
message: edge:references:type
rule:
  kind: type_identifier
  pattern: $CALLEE
  not:
    any:
      - inside:
          any:
            - { kind: struct_item }
            - { kind: enum_item }
            - { kind: union_item }
            - { kind: trait_item }
            - { kind: type_item }
            - { kind: associated_type }
          field: name
      - inside: { kind: scoped_type_identifier }
