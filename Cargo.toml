[package]
name = "claudecat"
version = "2.1.0"
edition = "2021"
description = "ClaudeCat V2 — 給 Claude Code 一張可信任的專案導航地圖 (pure Rust CLI)"
license = "MIT"
repository = "https://github.com/yanggf8/claudecat"

[[bin]]
name = "claudecat"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tree-sitter = "0.26"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
